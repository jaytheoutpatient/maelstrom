# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Variables Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/colors.conf

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 1
    gaps_out = 1
    border_size = 1
    col.active_border = rgba(100,20,25,1)
    col.inactive_border = rgba(15,15,15,1)
    resize_on_border = true
   # hover_icon_on_border = true
    layout = dwindle # master|dwindle

    # https://wiki.hyprland.org/Configuring/Variables/#snap
    snap {
        enabled = false
        border_overlap = false
        monitor_gap = 1

    }
}

decoration {
    rounding = 0
    rounding_power = 1.0
    active_opacity = 0.9
    inactive_opacity = 0.9
      shadow {
          enabled = true
          range = 4
          render_power = 3
          color = rgba(220,0,80,1)
          color_inactive = rgba(15,15,15,1)
        }
        blur {
            enabled = true
            size = 8
            contrast = 0.9
          }
  }
cursor {
  inactive_timeout = 3
  }
  
# removed old gestures {} block — Hyprland 0.39+ uses gesture = … lines

